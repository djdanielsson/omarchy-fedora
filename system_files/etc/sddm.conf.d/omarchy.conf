# Omarchy-Fedora SDDM defaults — ThinkPad T14s HiDPI safe.
# Full Omarchy SDDM theme port still TODO (see README); use distro default
# theme so login never fails on missing theme. Wayland greeter avoids
# X11 input driver issues from the old "no mouse" bug.
[General]
DisplayServer=wayland
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Wayland]
EnableHiDPI=true
# CompositorCommand left at distro default (needs cage/kwin).
# Uncomment once cage is added to packages if Wayland greeter fails:
# CompositorCommand=cage -s -- sddm-greeter --socket $WAYLAND_DISPLAY

[Theme]
# Current=  # unset = distro default; set to omarchy theme once ported
